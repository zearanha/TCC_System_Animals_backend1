services:
  db:
    image: postgres:16-alpine
    container_name: municipal_animais_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: municipal_animais
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d municipal_animais"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: municipal_animais_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/municipal_animais?schema=public
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001
    ports:
      - "3002:3000"

volumes:
  postgres_data:
